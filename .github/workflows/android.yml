# Compile l'APK Android (Capacitor) à partir de www/index.html et le publie en Release GitHub.
# À chaque push sur main, ou manuellement (onglet Actions > Run workflow).
# Numéro de version = numéro d'exécution du workflow : l'application compare le sien à la dernière Release
# (bouton « Check for updates ») et télécharge l'APK publié (Releases > latest > Engine48.apk).
name: Application Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Numéro de version
        run: |
          sed -i "s/const APP_BUILD = 0;/const APP_BUILD = $BUILD;/" www/index.html
          grep -q "const APP_BUILD = $BUILD;" www/index.html

      - name: Projet Android
        run: |
          npx cap add android
          sed -i -E "s/versionCode [0-9]+/versionCode $BUILD/; s/versionName \"[^\"]*\"/versionName \"1.$BUILD\"/" android/app/build.gradle
          grep -q "versionCode $BUILD" android/app/build.gradle
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0d1b26' --iconBackgroundColorDark '#0d1b26' \
            --splashBackgroundColor '#0d1b26' --splashBackgroundColorDark '#0d1b26'
          npx cap sync android

      # Clé fixe (secret ANDROID_KEYSTORE_B64) : même signature à chaque version, donc mise à jour
      # sans désinstaller. Le dépôt est public : la clé n'est jamais publiée en artefact.
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_B64 manquant"; exit 1; fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Compilation
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Engine48.apk
          gh release create "v$BUILD" Engine48.apk --title "Engine48 v$BUILD" \
            --notes "${NOTES:-Manual build}" --latest
          # garde les 5 dernières versions
          gh release list --limit 100 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[5:][] | .tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag -y
