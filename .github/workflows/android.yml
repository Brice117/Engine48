# Compile l'APK Android (Capacitor) à partir de www/index.html.
# À chaque push sur main, ou manuellement (onglet Actions > Run workflow).
# L'APK est téléchargeable dans l'onglet Actions (artefact « Engine48-apk »).
name: Application Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0d1b26' --iconBackgroundColorDark '#0d1b26' \
            --splashBackgroundColor '#0d1b26' --splashBackgroundColorDark '#0d1b26'
          npx cap sync android

      # Clé fixe (secret ANDROID_KEYSTORE_B64) : même signature à chaque version, donc mise à jour
      # possible sans désinstaller. Au premier passage (secret absent), une clé est créée et publiée en artefact.
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Engine48"
            cp ~/.android/debug.keystore "$GITHUB_WORKSPACE/new-keystore.jks"
          fi

      - name: Nouvelle clé (à enregistrer dans les secrets)
        if: hashFiles('new-keystore.jks') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nouvelle-cle
          path: new-keystore.jks
          retention-days: 1

      - name: Compilation
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: Engine48-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
