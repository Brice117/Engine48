<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b26">
<title>Engine48</title>
<style>
  :root {
    --bg: #0d1b26; --card: #15283a; --card2: #1c3449; --line: #2a4660;
    --text: #e8f1f8; --muted: #8fa9bf; --accent: #3fb6ff; --ok: #4fd18b; --warn: #ffb547; --danger: #ff6b6b;
    --nav: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + var(--nav) + 90px); }
  main { max-width: 560px; margin: 0 auto; }
  [hidden] { display: none !important; }
  button { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line);
    border-radius: 12px; cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(.96); background: var(--line); }
  input, textarea { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line);
    border-radius: 12px; outline: none; min-width: 0; }
  input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(63,182,255,.25); }
  .primary { background: var(--accent); border-color: var(--accent); color: #062033; font-weight: 600; }

  header { margin: 2px 2px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .upd-btn { height: 40px; padding: 0 12px; font-size: .85rem; color: var(--muted); border-radius: 20px; white-space: nowrap; }
  .upd-banner { border-color: var(--accent); background: rgba(63,182,255,.1); display: flex; gap: 10px; align-items: center; }
  .upd-banner div { flex: 1; font-size: .9rem; }
  .upd-banner small { display: block; color: var(--muted); margin-top: 2px; white-space: pre-wrap; }
  .upd-banner button { height: 46px; padding: 0 14px; flex: none; }
  h1 { font-size: 1.2rem; margin: 0; }
  h1 b { color: var(--accent); }
  h1 small { display: block; font-size: .75rem; font-weight: 400; color: var(--muted); margin-top: 2px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
  .label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .warn { color: var(--warn); font-size: .8rem; margin-top: 6px; }
  .warn:empty { display: none; }

  /* trim */
  .trim-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .trim-row { display: flex; gap: 8px; }
  .step { width: 56px; height: 56px; font-size: 1.6rem; flex: none; }
  #trim { flex: 1; height: 56px; font-size: 1.6rem; text-align: center; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 14px 0 2px; accent-color: var(--accent); height: 28px; background: none; border: none; box-shadow: none; }
  .scale { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); padding: 0 4px; }

  /* tanks */
  .tank { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; }
  .tank.filled { border-color: #2f5a7a; }
  .tank-name { font-weight: 600; font-size: 1rem; }
  .tank-no { display: inline-block; min-width: 34px; padding: 2px 6px; margin-right: 8px; border-radius: 8px;
    background: rgba(63,182,255,.15); color: var(--accent); text-align: center; font-size: .85rem; }
  .vol { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .vol b { font-size: 1.6rem; color: var(--ok); }
  .vol span { color: var(--muted); font-size: .85rem; margin-left: 3px; }
  .vol.empty b { color: var(--muted); font-weight: 400; }
  .sound { position: relative; }
  .sound input { width: 100%; height: 56px; font-size: 1.5rem; padding: 0 44px 0 14px; font-variant-numeric: tabular-nums; }
  .sound .unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .gauge { width: 56px; height: 56px; border: 2px solid var(--line); border-radius: 10px; position: relative; overflow: hidden; }
  .gauge i { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#3fb6ff, #1f7fc0); transition: height .25s; }
  .gauge em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: .8rem;
    font-weight: 600; text-shadow: 0 1px 2px #000; }
  .tank .warn { grid-column: 1 / -1; }

  /* items */
  .search { width: 100%; height: 50px; padding: 0 14px; font-size: 1.05rem; margin-bottom: 10px; }
  .item { display: block; width: 100%; text-align: left; padding: 12px 14px; background: var(--card); border-radius: 16px; margin-bottom: 8px; }
  .item-id { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; word-break: break-all; }
  .item-desc { margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .item-pos { margin-top: 6px; color: var(--muted); font-size: .9rem; }
  .item-pos:before { content: "📍 "; }
  .item mark { background: rgba(255,181,71,.35); color: inherit; border-radius: 3px; }
  .empty-list { text-align: center; color: var(--muted); padding: 36px 12px; }

  /* action bar (above the nav) */
  .bar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + var(--nav)); padding: 10px 12px;
    background: rgba(13,27,38,.96); border-top: 1px solid var(--line); backdrop-filter: blur(6px); }
  .bar-in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }
  .total .label { display: block; }
  .total b { font-size: 1.7rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .total span { color: var(--muted); font-size: .85rem; margin-left: 3px; }
  .bar button { height: 52px; padding: 0 14px; }
  button.armed { border-color: var(--danger); color: var(--danger); }

  /* bottom nav */
  nav { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom); background: var(--card); border-top: 1px solid var(--line); display: flex; }
  nav button { flex: 1; border: none; border-radius: 0; background: none; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .8rem; }
  nav button span { font-size: 1.35rem; line-height: 1; }
  nav button.on { color: var(--accent); }
  nav button:active { transform: none; }

  /* item editor */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { width: 100%; max-width: 560px; background: var(--card); border-radius: 20px 20px 0 0; border: 1px solid var(--line);
    padding: 16px 14px calc(env(safe-area-inset-bottom) + 14px); max-height: 92vh; overflow: auto; }
  .sheet h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; margin-bottom: 6px; }
  .field input, .field textarea { width: 100%; padding: 12px 14px; font-size: 1.1rem; }
  .field input { height: 52px; }
  .field textarea { min-height: 90px; resize: vertical; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 4px; }
  .sheet-actions button { height: 52px; padding: 0 16px; }
  #itemDelete { color: var(--danger); }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + var(--nav) + 86px); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: .9rem;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Engine<b>48</b><small id="subtitle">Tank sounding — net volume (m³)</small></h1>
    <button type="button" class="upd-btn" id="updBtn" aria-label="Check for updates">⟳ v0</button>
  </header>
  <section class="card upd-banner" id="updBanner" hidden>
    <div><b id="updTitle"></b><small id="updNotes"></small></div>
    <button type="button" class="primary" id="updGet">Download</button>
  </section>

  <!-- Sounding -->
  <div id="viewSounding">
    <section class="card">
      <div class="trim-top">
        <span class="label">Trim</span>
        <span class="label">metres</span>
      </div>
      <div class="trim-row">
        <button type="button" class="step" id="trimDown" aria-label="Decrease trim by 0.05">−</button>
        <input id="trim" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="0.00" aria-label="Trim in metres">
        <button type="button" class="step" id="trimUp" aria-label="Increase trim by 0.05">+</button>
      </div>
      <input type="range" id="trimSlider" min="-0.5" max="0.5" step="0.01" value="0" aria-label="Trim slider">
      <div class="scale"><span>−0.5</span><span>−0.25</span><span>0</span><span>+0.25</span><span>+0.5</span></div>
      <div class="warn" id="trimWarn"></div>
    </section>
    <div id="tanks"></div>
  </div>

  <!-- Items -->
  <div id="viewItems" hidden>
    <input type="search" class="search" id="itemSearch" placeholder="Search ID, description, position…" autocomplete="off" aria-label="Search items">
    <div id="itemList"></div>
  </div>
</main>

<div class="bar" id="barSounding">
  <div class="bar-in">
    <div class="total grow"><span class="label">Total</span><b id="total">—</b><span>m³</span></div>
    <button type="button" id="clear">Clear</button>
    <button type="button" class="primary" id="share">Share</button>
  </div>
</div>
<div class="bar" id="barItems" hidden>
  <div class="bar-in">
    <div class="grow label" id="itemCount"></div>
    <button type="button" id="itemExport">Export</button>
    <button type="button" class="primary" id="itemAdd">+ Add item</button>
  </div>
</div>

<nav>
  <button type="button" data-view="Sounding" class="on"><span>⛽</span>Sounding</button>
  <button type="button" data-view="Items"><span>🔧</span>Items</button>
</nav>

<div class="sheet-bg" id="sheet" hidden>
  <form class="sheet" id="itemForm" autocomplete="off">
    <h2 id="sheetTitle">New item</h2>
    <div class="field">
      <label class="label" for="fId">Material ID</label>
      <input id="fId" enterkeyhint="next" required>
    </div>
    <div class="field">
      <label class="label" for="fDesc">Description</label>
      <textarea id="fDesc" enterkeyhint="next"></textarea>
    </div>
    <div class="field">
      <label class="label" for="fPos">Position</label>
      <input id="fPos" enterkeyhint="done" placeholder="e.g. Engine room, deck 2, rack B">
    </div>
    <div class="sheet-actions">
      <button type="button" id="itemDelete">Delete</button>
      <div class="grow"></div>
      <button type="button" id="itemCancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
// Sounding tables: [cm, Tr -0.5, Tr 0, Tr +0.5] — values from the source file
const TANKS = [
  { id: 80, name: 'Dirty Bilge', rows: [
    [0, 0.18, 0.19, 0.21], [10, 0.82, 0.83, 0.84], [20, 1.45, 1.47, 1.48], [30, 2.09, 2.11, 2.12],
    [40, 2.73, 2.74, 2.76], [50, 3.37, 3.38, 3.40], [60, 4.01, 4.02, 4.04], [70, 4.65, 4.66, 4.67],
    [80, 5.28, 5.30, 5.31], [90, 5.92, 5.94, 5.95], [97, 6.36, 6.38, 6.38]] },
  { id: 50, name: 'Oily Bilge', rows: [
    [0, 0.81, 0.64, 0.47], [10, 2.93, 2.77, 2.60], [20, 5.06, 4.89, 4.72], [30, 7.19, 7.02, 6.85],
    [40, 9.31, 9.15, 8.98], [50, 11.44, 11.27, 11.10], [60, 13.57, 13.40, 13.23], [70, 15.70, 15.53, 15.36],
    [80, 17.82, 17.65, 17.48], [90, 19.95, 19.78, 19.61], [97, 21.25, 21.27, 21.08]] },
  { id: 24, name: 'Sludge PS', rows: [
    [0, 0.33, 0.29, 0.25], [10, 1.29, 1.25, 1.21], [20, 2.25, 2.21, 2.17], [30, 3.21, 3.17, 3.13],
    [40, 4.17, 4.13, 4.09], [50, 5.14, 5.09, 5.05], [60, 6.10, 6.06, 6.02], [70, 7.06, 7.02, 6.98],
    [80, 8.02, 7.98, 7.94], [90, 8.98, 8.94, 8.90], [97, 9.61, 9.61, 9.57]] },
  { id: 94, name: 'Sludge SB', rows: [
    [0, 0.30, 0.31, 0.34], [10, 2.24, 2.21, 2.18], [20, 4.34, 4.31, 4.28], [30, 6.43, 6.41, 6.38],
    [40, 8.53, 8.51, 8.48], [50, 10.63, 10.61, 10.58], [60, 12.73, 12.70, 12.68], [70, 14.83, 14.80, 14.78],
    [80, 16.93, 16.90, 16.88], [90, 19.03, 19.00, 18.97], [97, 20.42, 20.47, 20.39]] },
];
const TRIM_MAX = 0.5;

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const parseNum = s => {
  s = String(s).trim().replace(',', '.').replace('−', '-');
  if (s === '' || s === '-' || s === '.') return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
};
const fmt = (n, d = 2) => n.toFixed(d);

// 1) interpolate on trim: columns -0.5 / 0 / +0.5
function trimValue(row, trim) {
  const [, m, z, p] = row;
  return trim <= 0 ? lerp(z, m, -trim / TRIM_MAX) : lerp(z, p, trim / TRIM_MAX);
}

// 2) interpolate on sounding between the two bracketing rows
function volume(tank, cm, trim) {
  const rows = tank.rows;
  const maxCm = rows[rows.length - 1][0];
  const h = clamp(cm, 0, maxCm);
  const t = clamp(trim, -TRIM_MAX, TRIM_MAX);
  let i = 0;
  while (i < rows.length - 2 && h > rows[i + 1][0]) i++;
  const lo = rows[i], hi = rows[i + 1];
  const vLo = trimValue(lo, t), vHi = trimValue(hi, t);
  const f = (h - lo[0]) / (hi[0] - lo[0]);
  return { v: lerp(vLo, vHi, f), lo, hi, vLo, vHi, f, h, t, maxCm };
}

// --- saved state ---
const load = (key, def) => { try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch (e) { return def; } };
const store = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} };
const state = Object.assign({ trim: '', cm: {} }, load('engine48-sounding', {}));
const save = () => store('engine48-sounding', state);
let items = load('engine48-items', []);
const saveItems = () => store('engine48-items', items);

// --- common ---
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTrim = n => (n > 0 ? '+' : '') + fmt(n);
const stamp = () => {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// share sheet (native Android plugin, then Web Share, then clipboard)
async function shareText(title, text) {
  try {
    const native = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
    if (native) { await native.share({ title, text }); return; }
    if (navigator.share) { await navigator.share({ title, text }); return; }
    await navigator.clipboard.writeText(text);
    toast('Copied to clipboard');
  } catch (e) {
    if (e && (e.name === 'AbortError' || /cancel/i.test(e.message || ''))) return;
    try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }
    catch (e2) { toast('Sharing unavailable'); }
  }
}

// button that needs a second tap within 3 s
function confirmTap(btn, label, action) {
  let timer;
  btn.addEventListener('click', () => {
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed'); btn.textContent = 'Confirm?';
      timer = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = label; }, 3000);
      return;
    }
    clearTimeout(timer);
    btn.classList.remove('armed'); btn.textContent = label;
    action();
  });
}

// --- tabs ---
const SUBTITLES = { Sounding: 'Tank sounding — net volume (m³)', Items: 'Items — material ID and position' };
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));
function showView(v) {
  for (const name of Object.keys(SUBTITLES)) {
    $('view' + name).hidden = name !== v;
    $('bar' + name).hidden = name !== v;
  }
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $('subtitle').textContent = SUBTITLES[v];
  store('engine48-view', v);
  window.scrollTo(0, 0);
}

// ================= Sounding =================
const trimInput = $('trim'), slider = $('trimSlider');
let last = [];   // last results, for sharing

$('tanks').innerHTML = TANKS.map(t => `
  <section class="card tank" data-tank="${t.id}">
    <div class="tank-name"><span class="tank-no">${t.id}</span>${t.name}</div>
    <div class="vol empty" data-vol="${t.id}"><b>—</b><span>m³</span></div>
    <div class="sound">
      <input inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="Sounding"
        aria-label="Sounding of tank ${t.id} in cm" data-cm="${t.id}" value="${esc(state.cm[t.id] ?? '')}">
      <span class="unit">cm</span>
    </div>
    <div class="gauge" aria-hidden="true"><i data-fill="${t.id}" style="height:0"></i><em data-pct="${t.id}"></em></div>
    <div class="warn" data-warn="${t.id}"></div>
  </section>`).join('');
trimInput.value = state.trim;

const q = (attr, id) => document.querySelector(`[data-${attr}="${id}"]`);

function render() {
  const trimRaw = parseNum(trimInput.value);
  const trim = trimRaw ?? 0;
  if (document.activeElement !== slider) slider.value = clamp(trim, -TRIM_MAX, TRIM_MAX);
  $('trimWarn').textContent = trimRaw !== null && Math.abs(trimRaw) > TRIM_MAX
    ? `Outside table: calculated at ${fmtTrim(clamp(trimRaw, -TRIM_MAX, TRIM_MAX))} m` : '';

  let total = 0;
  last = [];
  for (const tank of TANKS) {
    const cm = parseNum(q('cm', tank.id).value);
    const volEl = q('vol', tank.id);
    if (cm === null) {
      volEl.querySelector('b').textContent = '—'; volEl.classList.add('empty');
      q('fill', tank.id).style.height = '0'; q('pct', tank.id).textContent = '';
      q('warn', tank.id).textContent = '';
    } else {
      const r = volume(tank, cm, trim);
      const pct = Math.round(100 * r.v / volume(tank, r.maxCm, trim).v);
      total += r.v;
      last.push({ tank, cm, v: r.v });
      volEl.querySelector('b').textContent = fmt(r.v); volEl.classList.remove('empty');
      q('fill', tank.id).style.height = pct + '%'; q('pct', tank.id).textContent = pct + '%';
      q('warn', tank.id).textContent = cm < 0 || cm > r.maxCm ? `Outside table: calculated at ${r.h} cm` : '';
    }
    q('tank', tank.id).classList.toggle('filled', cm !== null);
  }
  $('total').textContent = last.length ? fmt(total) : '—';
}

function setTrim(v) {
  trimInput.value = fmt(Math.round(v * 100) / 100);
  state.trim = trimInput.value; save(); render();
}

// trim: typing, ±0.05 steps (hold to repeat), slider
trimInput.addEventListener('input', () => { state.trim = trimInput.value; save(); render(); });
for (const [id, d] of [['trimDown', -0.05], ['trimUp', 0.05]]) {
  const b = $(id);
  let timer;
  const step = () => setTrim(clamp((parseNum(trimInput.value) ?? 0) + d, -TRIM_MAX, TRIM_MAX));
  const stop = () => clearInterval(timer);
  b.addEventListener('pointerdown', e => { e.preventDefault(); step(); stop(); timer = setInterval(step, 180); });
  b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
}
slider.addEventListener('input', () => setTrim(Number(slider.value)));

// soundings: Enter jumps to the next field, focus selects the value for quick retyping
const fields = [trimInput, ...document.querySelectorAll('[data-cm]')];
fields.forEach((inp, i) => {
  inp.addEventListener('focus', () => setTimeout(() => inp.select(), 0));
  inp.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (fields[i + 1]) fields[i + 1].focus(); else inp.blur();
  });
});
fields[fields.length - 1].setAttribute('enterkeyhint', 'done');
document.querySelectorAll('[data-cm]').forEach(inp => inp.addEventListener('input', () => {
  state.cm[inp.dataset.cm] = inp.value; save(); render();
}));

confirmTap($('clear'), 'Clear', () => {
  document.querySelectorAll('[data-cm]').forEach(inp => inp.value = '');
  state.cm = {}; save(); render();
  toast('Soundings cleared');
});

$('share').addEventListener('click', () => {
  if (!last.length) { toast('Enter at least one sounding'); return; }
  const trim = clamp(parseNum(trimInput.value) ?? 0, -TRIM_MAX, TRIM_MAX);
  const lines = [`Tank soundings — ${stamp()}`, `Trim: ${fmtTrim(trim)} m`, ''];
  let total = 0;
  for (const { tank, cm, v } of last) {
    lines.push(`${tank.id} ${tank.name}: ${cm} cm → ${fmt(v)} m³`);
    total += v;
  }
  lines.push('', `Total: ${fmt(total)} m³`);
  shareText('Tank soundings', lines.join('\n'));
});

// ================= Items =================
let editing = null;   // item being edited, null = new

function highlight(text, term) {
  const s = esc(text);
  if (!term) return s;
  const re = new RegExp(esc(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  return s.replace(re, m => `<mark>${m}</mark>`);
}

function renderItems() {
  const term = $('itemSearch').value.trim();
  const t = term.toLowerCase();
  const list = items
    .filter(it => !t || [it.mid, it.desc, it.pos].some(f => f.toLowerCase().includes(t)))
    .sort((a, b) => a.mid.localeCompare(b.mid, undefined, { numeric: true, sensitivity: 'base' }));
  $('itemList').innerHTML = list.length ? list.map(it => `
    <button type="button" class="item" data-item="${it.id}">
      <div class="item-id">${highlight(it.mid, term)}</div>
      ${it.desc ? `<div class="item-desc">${highlight(it.desc, term)}</div>` : ''}
      ${it.pos ? `<div class="item-pos">${highlight(it.pos, term)}</div>` : ''}
    </button>`).join('')
    : `<div class="empty-list">${items.length ? 'No item matches this search.' : 'No items yet.<br>Tap “+ Add item” to record one.'}</div>`;
  $('itemCount').textContent = items.length === 1 ? '1 item' : `${items.length} items`;
}

$('itemSearch').addEventListener('input', renderItems);
$('itemList').addEventListener('click', e => {
  const b = e.target.closest('[data-item]');
  if (b) openSheet(items.find(it => it.id === b.dataset.item));
});
$('itemAdd').addEventListener('click', () => openSheet(null));

// editor sheet; an history entry lets the Android back button close it
function openSheet(item) {
  editing = item;
  $('sheetTitle').textContent = item ? 'Edit item' : 'New item';
  $('fId').value = item ? item.mid : '';
  $('fDesc').value = item ? item.desc : '';
  $('fPos').value = item ? item.pos : '';
  $('itemDelete').hidden = !item;
  $('sheet').hidden = false;
  history.pushState({ sheet: true }, '');
  if (!item) setTimeout(() => $('fId').focus(), 50);
}
function closeSheet() {
  if (history.state && history.state.sheet) history.back(); else $('sheet').hidden = true;
}
window.addEventListener('popstate', () => { $('sheet').hidden = true; });
$('itemCancel').addEventListener('click', closeSheet);
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
$('fId').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('fDesc').focus(); } });

$('itemForm').addEventListener('submit', e => {
  e.preventDefault();
  const mid = $('fId').value.trim(), desc = $('fDesc').value.trim(), pos = $('fPos').value.trim();
  if (!mid) { $('fId').focus(); return; }
  const dup = items.find(it => it !== editing && it.mid.toLowerCase() === mid.toLowerCase());
  if (dup && !$('fId').dataset.dupOk) {
    $('fId').dataset.dupOk = '1';
    toast('This ID already exists — Save again to keep both');
    return;
  }
  delete $('fId').dataset.dupOk;
  if (editing) Object.assign(editing, { mid, desc, pos, updated: Date.now() });
  else items.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), mid, desc, pos, updated: Date.now() });
  saveItems(); renderItems(); closeSheet();
  toast(editing ? 'Item updated' : 'Item added');
});
$('fId').addEventListener('input', () => delete $('fId').dataset.dupOk);

confirmTap($('itemDelete'), 'Delete', () => {
  items = items.filter(it => it !== editing);
  saveItems(); renderItems(); closeSheet();
  toast('Item deleted');
});

// export as CSV text (to send by mail / save as a backup)
$('itemExport').addEventListener('click', () => {
  if (!items.length) { toast('No items to export'); return; }
  const cell = s => /[",;\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  const rows = [['Material ID', 'Description', 'Position'], ...items.map(it => [it.mid, it.desc, it.pos])];
  shareText(`Engine48 items ${stamp()}`, rows.map(r => r.map(cell).join(';')).join('\n'));
});

render();
renderItems();
showView(load('engine48-view', 'Sounding') === 'Items' ? 'Items' : 'Sounding');

// ================= Updates =================
// APP_BUILD is set by the build workflow (0 = development copy); releases are tagged v<build>
const APP_BUILD = 0;
const REPO = 'Brice117/Engine48';
let updUrl = null;
$('updBtn').textContent = APP_BUILD ? `⟳ v${APP_BUILD}` : '⟳ dev';

async function checkUpdate(manual) {
  const btn = $('updBtn'), label = btn.textContent;
  if (manual) btn.textContent = 'Checking…';
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`,
      { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    if (r.status === 404) { if (manual) toast('No published version yet'); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rel = await r.json();
    const latest = parseInt(String(rel.tag_name).replace(/\D/g, ''), 10) || 0;
    const asset = (rel.assets || []).find(a => /\.apk$/i.test(a.name));
    if (latest > APP_BUILD && asset) {
      updUrl = asset.browser_download_url;
      $('updTitle').textContent = `New version v${latest} available`;
      $('updNotes').textContent = (rel.body || '').split('\n')[0].slice(0, 120);
      $('updBanner').hidden = false;
    } else if (manual) {
      toast(`Engine48 is up to date (v${latest})`);
    }
  } catch (e) {
    if (manual) toast('No connection — try again later');
  } finally {
    btn.textContent = label;
  }
}

// the APK opens in the browser, which downloads it; Android then offers to install it
$('updGet').addEventListener('click', async () => {
  if (!updUrl) return;
  const browser = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser;
  try {
    if (browser) await browser.open({ url: updUrl });
    else window.open(updUrl, '_blank');
    toast('Download started — open it to install');
  } catch (e) {
    window.location.href = updUrl;
  }
});
$('updBtn').addEventListener('click', () => checkUpdate(true));
if (navigator.onLine !== false) checkUpdate(false);
</script>
